# Publica el test en GitHub Pages.
#
# Con `enablement: true`, este workflow activa Pages en el repositorio si aún no
# lo está, así que no hace falta tocar Settings → Pages a mano.
name: Publicar en GitHub Pages

on:
  push:
    branches: ["claude/interactive-form-8-questions-05dqqj"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancelamos los que ya estén en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # El sitio es estático: se sube la raíz del repositorio tal cual.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
